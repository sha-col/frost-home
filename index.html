<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Frost</title>
  <style>
    :root {
      --bg: #0b0f14;
      --card: #161c24;
      --card-hover: #1e2630;
      --text: #f2f5f8;
      --muted: #8b97a8;
      --border: #2a3441;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      padding: 28px 24px 40px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header { margin-bottom: 28px; }
    header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    a.tile {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 88px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 560;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    a.tile:active {
      background: var(--card-hover);
      transform: scale(0.98);
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .section {
      margin-top: 28px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <h1>Frost</h1>
    <p>Tap a shortcut</p>
  </header>

  <div class="section">Nav</div>
  <div class="grid">
    <a class="tile" href="https://teslanav.com/"><span class="dot" style="background:#cc0000"></span>TeslaNav</a>
  </div>

  <div class="section">Google</div>
  <div class="grid">
    <a class="tile" href="https://keep.google.com/"><span class="dot" style="background:#fbbc04"></span>Google Keep</a>
    <a class="tile" href="https://tasks.google.com/"><span class="dot" style="background:#4285f4"></span>Google Tasks</a>
    <a class="tile" href="https://mail.google.com/"><span class="dot" style="background:#ea4335"></span>Gmail</a>
    <a class="tile" href="https://www.google.com/"><span class="dot" style="background:#34a853"></span>Google</a>
  </div>


  <div class="section">Work</div>
  <div class="grid">
    <a class="tile" href="https://teams.cloud.microsoft/"><span class="dot" style="background:#6264a7"></span>Teams</a>
    <a class="tile" href="https://outlook.office.com/mail/"><span class="dot" style="background:#0078d4"></span>Outlook</a>
  </div>

  <div class="section">Streaming</div>
  <div class="grid">
    <a class="tile" href="https://www.netflix.com/"><span class="dot" style="background:#e50914"></span>Netflix</a>
    <a class="tile" href="https://play.max.com/"><span class="dot" style="background:#002be7"></span>Max (HBO)</a>
    <a class="tile" href="https://www.paramountplus.com/"><span class="dot" style="background:#0064ff"></span>Paramount+</a>
    <a class="tile" href="https://www.disneyplus.com/"><span class="dot" style="background:#113ccf"></span>Disney+</a>
    <a class="tile" href="https://www.primevideo.com/"><span class="dot" style="background:#00a8e1"></span>Prime Video</a>
    <a class="tile" href="https://www.mgmplus.com/"><span class="dot" style="background:#a48032"></span>MGM+</a>
    <a class="tile" href="https://tv.apple.com/"><span class="dot" style="background:#a2aaad"></span>Apple TV+</a>
  </div>
</body>
</html>
